<!doctype html>
<html>
	<head>
		<title>Genuine Test Print</title>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="./library/styles/paramsPanel.css" />
		<link rel="stylesheet" href="./style.css" />
		<script src="./library/utils/fxhash.js"></script>
		<script src="./library/p5/p5.min.js"></script>
		<script src="./library/p5/p5.sound.min.js"></script>
		<script src="./library/p5/p5.chroma.js"></script>
		<script src="./library/utils/chromaPalette.js"></script>
		<script src="./palettes/palettes.js"></script>
		<script src="./parameters/params.js"></script>
		<script src="./library/utils/paramsPanel.js"></script>
		<script src="./library/utils/utils.js"></script>
		<script src="./library/utils/artworkLayout.js"></script>
		<script src="./library/utils/audioAnalyzer.js"></script>
		<script src="./library/utils/audioKnob.js"></script>
		<script src="./library/utils/audioDebugDisplay.js"></script>
		<script src="./library/utils/shaderEffectsPanel.js"></script>
		<script src="./library/utils/shaderManager.js"></script>
		<script src="./library/utils/shaderPipeline.js"></script>
		<script src="./shapes/mover.js"></script>
		<script src="./shaders/sketch-shaders.js"></script>
		<script src="sketch.js"></script>

		<!-- if you need to import js scripts do it here -->
	</head>
	<body>
		<div class="params-toggles">
			<div class="info-toggle">Edit parameters</div>
			<button type="button" class="generate-toggle" id="param-generate">Generate new piece</button>
		</div>
		<div class="container" aria-label="Controls panel">
			<div class="title-wrapper">
				<h1 class="title">Controls</h1>
				<h6 class="spec">Apply updates without changing seed/hash</h6>
				<p class="status">
					Activity status:
					<span class="spin-container">
						<span class="spin">.</span>
					</span>
				</p>
			</div>

			<div class="info-wrapper">
				<hr />
				<p class="info-container"><span class="info">Hash : </span><span class="kb-params hash"></span></p>
				<hr />

				<p class="info-container"><span class="info">Render status : </span><span class="kb-params dashboard"></span></p>
				<hr />
			</div>

			<div class="controls-form"></div>

			<div class="save-wrapper">
				<button class="button btn-apply" id="param-apply">
					<span>Apply</span>
				</button>
				<button class="button btn-download" id="param-download" style="margin-top: 10px">
					<span>Download</span>
				</button>
				<div class="params-io-row">
					<button type="button" class="params-io" id="param-export-json" title="Export settings as JSON">↓ json</button>
					<button type="button" class="params-io" id="param-import-json" title="Import settings from JSON">↑ json</button>
					<input type="file" accept="application/json,.json" id="param-import-file" hidden />
				</div>
				<label class="persist-clear" title="Clear saved controls from localStorage and restore defaults">
					<input type="checkbox" id="param-clear-storage" />
					<span>Clear saved</span>
				</label>
			</div>
		</div>

		<main class="main">
			<span class="frame"></span>
		</main>

		<!-- Debug bounds overlay -->
		<div id="debug-bounds" class="debug-bounds">
			<div id="debug-base-padding" class="debug-rect base-padding"></div>
			<div id="debug-mover-bounds" class="debug-rect mover-bounds"></div>
		</div>
		<!-- Mobile controls container with download and FPS buttons -->
		<div id="controls" class="controls">
			<button id="toggle-fps" class="control-button" title="Toggle FPS Counter">FPS</button>
		</div>
		<button type="button" class="shader-panel-toggle" id="shader-panel-toggle" title="Shader panel (E)" aria-label="Shader panel" hidden>
			<svg class="shader-panel-toggle__icon shader-panel-toggle__icon--open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
				<path
					d="M197.58,129.06,146,110l-19-51.62a15.92,15.92,0,0,0-29.88,0L78,110l-51.62,19a15.92,15.92,0,0,0,0,29.88L78,178l19,51.62a15.92,15.92,0,0,0,29.88,0L146,178l51.62-19a15.92,15.92,0,0,0,0-29.88ZM137,164.22a8,8,0,0,0-4.74,4.74L112,223.85,91.78,169A8,8,0,0,0,87,164.22L32.15,144,87,123.78A8,8,0,0,0,91.78,119L112,64.15,132.22,119a8,8,0,0,0,4.74,4.74L191.85,144ZM144,40a8,8,0,0,1,8-8h16V16a8,8,0,0,1,16,0V32h16a8,8,0,0,1,0,16H184V64a8,8,0,0,1-16,0V48H152A8,8,0,0,1,144,40ZM248,88a8,8,0,0,1-8,8h-8v8a8,8,0,0,1-16,0V96h-8a8,8,0,0,1,0-16h8V72a8,8,0,0,1,16,0v8h8A8,8,0,0,1,248,88Z" />
			</svg>
			<svg class="shader-panel-toggle__icon shader-panel-toggle__icon--close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
				<path
					d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
			</svg>
		</button>
		<!-- WEBPACK will inject the bundle.js here -->
	</body>
</html>
